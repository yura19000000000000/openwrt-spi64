name: Build OpenWrt 25.12.6 (Beeline SBT+ SPI 64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Clone OpenWrt v25.12.6
        run: |
          HOST="github.com"
          ORG="openwrt"
          REPO="openwrt.git"
          git clone --depth 1 -b v25.12.6 "https://${HOST}/${ORG}/${REPO}" openwrt

      - name: Configure DTS, Makefile and LEDs (SPI 64MB + Breed)
        working-directory: openwrt
        run: |
          # 1. Создаем DTS на базе официального mt7621_sercomm_s3.dtsi (с правильными метками &gmac0, &wan, &wlan_2g, &wlan_5g)
          cat << 'EOF' > target/linux/ramips/dts/mt7621_beeline_sbtplusspi.dts
          // SPDX-License-Identifier: GPL-2.0-or-later

          #include "mt7621_sercomm_s3.dtsi"

          / {
          	compatible = "beeline,sbtplusspi", "mediatek,mt7621-soc";
          	model = "Beeline Smart Box Turbo+ SPI 64";

          	aliases {
          		label-mac-device = &gmac0;
          	};
          };

          &uartlite3 {
          	status = "okay";
          	current-speed = <57600>;
          };

          &spi0 {
          	status = "okay";

          	flash@0 {
          		compatible = "jedec,spi-nor";
          		reg = <0>;
          		spi-max-frequency = <40000000>;
          		broken-flash-reset;

          		partitions {
          			compatible = "fixed-partitions";
          			#address-cells = <1>;
          			#size-cells = <1>;

          			partition@0 {
          				label = "bootloader";
          				reg = <0x0 0x30000>;
          				read-only;
          			};

          			partition@30000 {
          				label = "config";
          				reg = <0x30000 0x10000>;
          				read-only;
          			};

          			factory: partition@40000 {
          				label = "factory";
          				reg = <0x40000 0x10000>;
          				read-only;
          			};

          			firmware: partition@50000 {
          				compatible = "denx,uimage";
          				label = "firmware";
          				reg = <0x50000 0x3fb0000>;
          			};
          		};
          	};
          };

          &gmac0 {
          	mac-address = [74 9d 79 76 2d 63];
          };

          &wan {
          	mac-address = [74 9d 79 76 2d 64];
          };

          &wlan_2g {
          	mediatek,mtd-eeprom = <&factory 0x0>;
          };

          &wlan_5g {
          	mediatek,mtd-eeprom = <&factory 0x8000>;
          };
          EOF

          # 2. Добавляем профиль устройства в mt7621.mk (с жесткой табуляцией)
          printf '\ndefine Device/beeline_sbtplusspi\n  $(Device/uimage-lzma-loader)\n  DEVICE_MODEL := Smart Box Turbo+ SPI 64\n  DEVICE_VENDOR := Beeline\n  IMAGE_SIZE := 65216k\n  DEVICE_PACKAGES := kmod-mt7603 kmod-mt7615e kmod-usb3 \\\n\tkmod-usb-ledtrig-usbport kmod-mt7615-firmware\nendef\nTARGET_DEVICES += beeline_sbtplusspi\n' >> target/linux/ramips/image/mt7621.mk

          # 3. Добавляем индикацию WAN в 01_leds по аналогии с официальным beeline,smartbox-turbo-plus
          python3 -c '
          path = "target/linux/ramips/mt7621/base-files/etc/board.d/01_leds"
          with open(path, "r") as f:
              data = f.read()
          if "beeline,smartbox-turbo-plus" in data:
              data = data.replace("beeline,smartbox-turbo-plus", "beeline,sbtplusspi|\\\nbeeline,smartbox-turbo-plus")
          with open(path, "w") as f:
              f.write(data)
          '

          # 4. Автоматическое включение русского языка LuCI при первом старте
          mkdir -p files/etc/uci-defaults
          cat << 'EOF' > files/etc/uci-defaults/99-custom-lang
          uci set luci.main.lang='ru'
          uci commit luci
          exit 0
          EOF
          chmod +x files/etc/uci-defaults/99-custom-lang

      - name: Update and install feeds
        working-directory: openwrt
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Generate clean Russian .config
        working-directory: openwrt
        run: |
          cat << 'EOF' > .config
          CONFIG_TARGET_ramips=y
          CONFIG_TARGET_ramips_mt7621=y
          CONFIG_TARGET_ramips_mt7621_DEVICE_beeline_sbtplusspi=y
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-i18n-base-ru=y
          CONFIG_PACKAGE_luci-i18n-firewall-ru=y
          CONFIG_PACKAGE_luci-i18n-package-manager-ru=y
          EOF
          make defconfig

      - name: Download sources and compile
        working-directory: openwrt
        run: |
          make download -j$(nproc)
          make -j$(nproc) V=s

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12.6-beeline-sbtplus-spi64
          path: openwrt/bin/targets/ramips/mt7621/*sysupgrade.bin
